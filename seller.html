<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Seller Dashboard | Vintage Rides
  </title>
  <link href="style.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
 </head>
 <body id="page-seller">
  <header id="navbar">
   <div class="container">
    <div class="logo">
     <a href="index.html">
      Vintage Rides
     </a>
    </div>
    <nav aria-label="Main navigation">
     <button aria-controls="main-navigation" aria-expanded="false" id="mobile-nav-toggle">
      <i class="fas fa-bars">
      </i>
     </button>
     <ul id="main-navigation">
      <li>
       <a href="index.html">
        Home
       </a>
      </li>
      <li>
       <a href="cars.html">
        Cars
       </a>
      </li>
      <li>
       <a href="compare.html">
        Compare
       </a>
      </li>
      <li>
       <a href="about.html">
        About Us
       </a>
      </li>
      <li>
       <a href="contact.html">
        Contact
       </a>
      </li>
      <li>
       <a href="login.html">
        Login / Register
       </a>
      </li>
      <li>
       <a href="cart.html">
        Cart (
        <span id="cart-item-count">
         0
        </span>
        )
       </a>
      </li>
     </ul>
    </nav>
   </div>
  </header>
  <main class="section section-light" id="seller-dashboard">
   <div class="container">
    <div class="crud-toolbar">
     <div>
      <h1>
       Seller Dashboard
      </h1>
      <p>
       Submit and manage your vehicle consignment listings.
      </p>
     </div>
     <button class="btn btn-outline-dark" data-logout="">
      Log out
     </button>
    </div>
    <section class="crud-panel">
     <h2>
      Submit a Vehicle for Consignment
     </h2>
     <form class="crud-grid" data-backend-form="" id="consignment-form">
      <div class="form-group">
       <label>
        Make
       </label>
       <input class="form-control" name="make" required=""/>
      </div>
      <div class="form-group">
       <label>
        Model
       </label>
       <input class="form-control" name="model" required=""/>
      </div>
      <div class="form-group">
       <label>
        Year
       </label>
       <input class="form-control" max="2026" min="1886" name="year" required="" type="number"/>
      </div>
      <div class="form-group">
       <label>
        Asking Price (USD)
       </label>
       <input class="form-control" min="1" name="price" required="" type="number"/>
      </div>
      <div class="form-group" style="grid-column:1/-1">
       <label>
        Condition / Description
       </label>
       <textarea class="form-control" name="description" required="" rows="3"></textarea>
      </div>
      <div>
       <button class="btn btn-primary" type="submit">
        Submit Consignment
       </button>
      </div>
     </form>
    </section>
    <section class="crud-panel">
     <h2>
      My Listings
     </h2>
     <div id="seller-records">
     </div>
    </section>
   </div>
  </main>
  <footer class="site-footer">
   <div class="container">
    <p>
     ©
     <span id="current-year">
     </span>
     Vintage Rides. All rights reserved.
    </p>
    <p>
     Classic cars. Trusted journeys.
    </p>
   </div>
  </footer>
  <script src="script.js">
  </script>
  <script src="feature-ui.js">
  </script>
 </body>
</html>
